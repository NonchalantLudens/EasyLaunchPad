name: EasyLaunchPad
options:
  bundleIdPrefix: com.easylaunchpad
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
targets:
  EasyLaunchPad:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easylaunchpad.app
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: EasyLaunchPad
        LSMinimumSystemVersion: "15.0"
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 NonchalantLudens"
  EasyLaunchPadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: EasyLaunchPad
schemes:
  EasyLaunchPad:
    build:
      targets:
        EasyLaunchPad: all
    test:
      config: Debug
      targets:
        - EasyLaunchPadTests
